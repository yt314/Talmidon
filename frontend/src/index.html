<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>תלמידון</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="תלמידון — ספריית מורות פרטיות וניהול מלא של שיעורים, מעקב פדגוגי ותשלומים.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // מחילים את המצב הכהה לפני הצביעה הראשונה, אחרת נראה הבזק לבן עד ש-Angular עולה.
    // חייב להישאר תואם ל-ThemeService (אותו מפתח אחסון, אותה מחלקה).
    (function () {
      try {
        var stored = localStorage.getItem('talmidon.theme');
        var dark = stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('app-dark');
      } catch (e) {
        // אחסון חסום — נשארים במצב הבהיר, ThemeService יסדר את השאר
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
