<app-page-header title="חומרי לימוד" icon="pi-folder-open" subtitle="החומרים שהמורה שיתפה עבור הילדים שלך.">
  @if (children().length > 1) {
    <p-select
      [options]="children()"
      optionLabel="fullName"
      optionValue="id"
      placeholder="כל הילדים"
      [showClear]="true"
      [ngModel]="selectedChildId()"
      (ngModelChange)="selectedChildId.set($event)" />
  }
</app-page-header>

<p-card>
  @if (loading()) {
    <div class="skeleton skeleton-line" style="height: 3rem"></div>
    <div class="skeleton skeleton-line" style="height: 3rem"></div>
  } @else if (resources().length === 0) {
    <app-empty-state
      icon="pi-folder-open"
      title="אין חומרי לימוד להצגה"
      hint="כשהמורה תשתף דף תרגול או סרטון, הוא יופיע כאן." />
  } @else {
    <app-resource-list [resources]="resources()" [showStudentName]="children().length > 1" />
  }
</p-card>
