<app-page-header title="ראשי" icon="pi-home" />

<div class="grid">
  <div class="col-12 md:col-4">
    <app-stat-card
      class="block h-full"
      label="הילדים שלי"
      icon="pi-users"
      tone="primary"
      link="/parent/lessons"
      [value]="children() === null ? null : children()!.length"
      [hint]="childrenNames()" />
  </div>

  <div class="col-12 md:col-4">
    <app-stat-card
      class="block h-full"
      label="השיעור הבא"
      icon="pi-calendar"
      tone="info"
      link="/parent/lessons"
      [value]="nextLesson() ? (nextLesson()!.startTime | date: 'dd/MM HH:mm') : (lessons() === null ? null : '—')"
      [hint]="nextLesson() ? nextLesson()!.studentName : (lessons() === null ? null : 'אין שיעורים קרובים')" />
  </div>

  <div class="col-12 md:col-4">
    <app-stat-card
      class="block h-full"
      label="תשלומים פתוחים"
      icon="pi-wallet"
      tone="warn"
      link="/parent/payments"
      [value]="openChargesTotal() === null ? null : openChargesTotal() + ' ₪'"
      [badge]="openChargesCount() ? openChargesCount() + ' חיובים' : null" />
  </div>
</div>

<p-card styleClass="mt-4">
  <h3 class="mt-0 mb-3">שיעורים קרובים</h3>

  @if (upcomingLessons() === null) {
    <p class="text-color-secondary">טוען...</p>
  } @else if (upcomingLessons()!.length === 0) {
    <p class="text-color-secondary">אין שיעורים קרובים מתוזמנים.</p>
  } @else {
    <ul class="parent-list">
      @for (lesson of upcomingLessons(); track lesson.id) {
        <li class="flex justify-content-between align-items-center py-2">
          <div class="flex align-items-center gap-3">
            <span class="text-color-secondary">{{ lesson.startTime | date: 'dd/MM HH:mm' }}</span>
            <span>{{ lesson.studentName }}</span>
          </div>
          <p-tag [value]="statusLabel(lesson.status)" [severity]="statusSeverity(lesson.status)" />
        </li>
      }
    </ul>
  }
</p-card>
