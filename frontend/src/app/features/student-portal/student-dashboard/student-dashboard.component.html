<app-page-header title="ראשי" icon="pi-home" />

<div class="grid">
  <div class="col-12 md:col-6">
    <app-stat-card
      class="block h-full"
      label="השיעור הבא"
      icon="pi-calendar"
      tone="primary"
      link="/student/lessons"
      [value]="nextLesson() ? (nextLesson()!.startTime | ilDate: 'dd/MM HH:mm') : (lessons() === null ? null : '—')"
      [hint]="nextLesson() ? null : (lessons() === null ? null : 'אין שיעורים קרובים')" />
  </div>

  @if (recentHomework(); as hw) {
    <div class="col-12 md:col-6">
      <app-stat-card
        class="block h-full"
        label="שיעורי בית אחרונים"
        icon="pi-book"
        tone="info"
        link="/student/lessons"
        variant="text"
        [value]="hw.homework" />
    </div>
  }
</div>

<p-card styleClass="mt-4">
  <h3 class="mt-0 mb-3">היומן שלי</h3>

  @if (upcomingLessons() === null) {
    <p class="text-color-secondary">טוען...</p>
  } @else if (upcomingLessons()!.length === 0) {
    <p class="text-color-secondary">אין שיעורים קרובים מתוזמנים.</p>
  } @else {
    <ul class="parent-list">
      @for (lesson of upcomingLessons(); track lesson.id) {
        <li class="flex justify-content-between align-items-center py-2">
          <span class="text-color-secondary">{{ lesson.startTime | ilDate: 'dd/MM HH:mm' }}</span>
          <p-tag [value]="statusLabel(lesson.status)" [severity]="statusSeverity(lesson.status)" />
        </li>
      }
    </ul>
  }
</p-card>
