<app-page-header title="הערות" icon="pi-book" subtitle="מה שהמורה שיתפה איתך אחרי השיעורים." />

@if (loading()) {
  <div class="flex flex-column gap-2">
    @for (i of [1, 2]; track i) {
      <div class="py-3">
        <p-skeleton width="30%" height="1rem" styleClass="mb-2" />
        <p-skeleton width="100%" height="1rem" styleClass="mb-1" />
        <p-skeleton width="60%" height="1rem" />
      </div>
    }
  </div>
} @else if (notes().length === 0) {
  <app-empty-state
    icon="pi-file-edit"
    title="אין הערות עדיין"
    hint="הערות שהמורה תסמן כגלויות לך יופיעו כאן, ותוכלי להגיב עליהן." />
} @else {
  <ul class="parent-list">
    @for (note of notes(); track note.id) {
      <li class="py-3 note-item">
        <p class="m-0" style="white-space: pre-wrap">{{ note.content }}</p>
        <div class="mt-2 flex align-items-center justify-content-between gap-2 flex-wrap">
          <span class="text-sm text-color-secondary">{{ note.createdAt | ilDate: 'dd/MM/yyyy HH:mm' }}</span>
          <p-button label="השב" icon="pi pi-reply" [text]="true" size="small" (onClick)="reply(note)" />
        </div>
      </li>
    }
  </ul>
}
