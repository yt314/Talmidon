<div class="app-shell">
  <p-toast />

  <header class="app-shell-topbar">
    <p-menubar [model]="menuItems">
      <ng-template pTemplate="start">
        <span class="brand ml-3">
          <span class="brand-mark"><i class="pi pi-graduation-cap"></i></span>
          תלמידון
        </span>
      </ng-template>
      <ng-template pTemplate="end">
        <div class="flex align-items-center gap-3">
          <span class="app-shell-greeting text-sm text-color-secondary" [title]="greeting()">{{ greeting() }}</span>
          <app-theme-toggle />
          <p-button icon="pi pi-sign-out" label="התנתקות" severity="secondary" [text]="true" (onClick)="logout()" />
        </div>
      </ng-template>
    </p-menubar>
  </header>

  <main class="app-shell-content">
    <router-outlet />
  </main>
</div>
