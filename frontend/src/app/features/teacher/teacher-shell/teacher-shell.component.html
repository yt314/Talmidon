<div class="app-shell">
  <p-toast />
  <p-confirmdialog />

  <header class="app-shell-topbar">
    <!--
      מתקפל להמבורגר מתחת ל-1200 ולא ל-960: שבעה פריטים לצד הלוגו, החיפוש,
      הפעמון ותפריט המשתמשת אינם נכנסים לשורה אחת ברוחבי הביניים, והתפריט
      נשבר לשתי שורות במקום להתקפל.
    -->
    <p-menubar [model]="menuItems" breakpoint="1200px">
      <ng-template pTemplate="start">
        <a routerLink="/" class="brand ml-3">
          <span class="brand-mark"><i class="pi pi-graduation-cap"></i></span>
          תלמידון
        </a>
      </ng-template>
      <ng-template pTemplate="end">
        <div class="flex align-items-center gap-3">
          <app-quick-search />
          <app-notifications-bell />
          <app-theme-toggle />
          <app-user-menu [name]="fullName()" roleLabel="מורה" (logout)="logout()" />
        </div>
      </ng-template>
    </p-menubar>
  </header>

  <main class="app-shell-content">
    @if (needsSetup()) {
      <div class="setup-reminder">
        <span class="flex align-items-center gap-2">
          <i class="pi pi-exclamation-circle"></i>
          הפרופיל הציבורי שלך עדיין לא מלא — בלעדיו הכרטיס שלך בספרייה חסר.
        </span>
        <span class="flex align-items-center gap-1">
          <p-button label="להשלמת הפרופיל" icon="pi pi-arrow-left" size="small" routerLink="/app/setup" />
          <p-button
            icon="pi pi-times"
            severity="secondary"
            [text]="true"
            size="small"
            ariaLabel="סגירת התזכורת"
            pTooltip="סגירה עד הכניסה הבאה"
            tooltipPosition="bottom"
            (onClick)="dismissSetupBanner()" />
        </span>
      </div>
    }

    <router-outlet />

    <app-beta-notice />
  </main>
</div>
