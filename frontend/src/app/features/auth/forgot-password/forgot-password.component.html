<div class="auth-page">
  <p-card styleClass="auth-card">
    <ng-template pTemplate="header">
      <div class="flex align-items-center gap-2 p-4 pb-0">
        <i class="pi pi-graduation-cap" style="font-size: 1.8rem; color: var(--p-primary-color)"></i>
        <h1 class="m-0 text-2xl font-bold">תלמידון</h1>
      </div>
    </ng-template>

    @if (done()) {
      <div class="text-center py-3">
        <i class="pi pi-envelope" style="font-size: 2.5rem; color: var(--p-primary-color)"></i>
        <h2 class="text-xl">בדקי את תיבת הדואר</h2>
        <p class="text-color-secondary">{{ successMessage() }}</p>
        <a routerLink="/login"><p-button label="חזרה להתחברות" icon="pi pi-arrow-left" [text]="true" /></a>
      </div>
    } @else {
      <h2 class="mt-0 mb-3 text-xl">שחזור סיסמה</h2>
      <p class="text-color-secondary mt-0 mb-3">הזיני את כתובת המייל שלך ונשלח קישור לקביעת סיסמה חדשה.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="email">אימייל *</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            class="w-full"
            autocomplete="username"
            [invalid]="isInvalid(form.controls.email)" />
          @if (fieldError(form.controls.email); as msg) {
            <small class="text-red-500 block mt-1">{{ msg }}</small>
          }
        </div>

        <p-button type="submit" label="שליחת קישור לאיפוס" icon="pi pi-send" [loading]="loading()" styleClass="w-full" />
      </form>

      <div class="mt-3 text-center text-sm">
        <a routerLink="/login">חזרה להתחברות</a>
      </div>
    }
  </p-card>
</div>
