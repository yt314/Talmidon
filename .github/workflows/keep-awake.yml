# Keeps the API from falling asleep while people are likely to be using it.
#
# On Render's free plan a web service spins down after a few minutes with no
# traffic, and the next visitor waits for it to boot. The visitor who pays that
# price is the worst possible one: a prospective student opening the public
# library or the enquiry form, who has no reason to believe the site is alive
# and every reason to close the tab.
#
# Deliberately NOT around the clock. Free plans cap how many hours a service may
# run each month, and a service kept awake every minute of every day sits right
# at that cap — running out would stop the site completely, which is far worse
# than a slow first request at 4am. Waking hours only, and the night keeps its
# cold start.
#
# The target is /api/health, which does not touch the database. Neon's free plan
# suspends the database on its own and meters compute hours, so a ping that ran
# a query would quietly keep that awake too and bill for the privilege.
name: Keep the API awake

on:
  schedule:
    # Every 10 minutes, 04:00–20:59 UTC. Israel is UTC+2 in winter and UTC+3 in
    # summer, so that is roughly 06:00/07:00 until midnight local, both seasons.
    - cron: "*/10 4-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# A late run is normal — GitHub's scheduler is best effort — but two runs piling
# up on top of each other serve no purpose.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          # Override by setting a repository variable named API_HEALTH_URL.
          HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://talmidon.onrender.com/api/health' }}
        run: |
          set -u
          echo "Pinging $HEALTH_URL"

          # A cold start can take the better part of a minute, and that is the
          # case this job exists for — so the timeout is generous and a slow
          # answer counts as success. Three tries cover a boot that overruns it.
          for attempt in 1 2 3; do
            code=$(curl --silent --show-error --location \
                        --max-time 90 --output /dev/null --write-out '%{http_code}' \
                        "$HEALTH_URL" || echo "000")

            if [ "$code" = "200" ]; then
              echo "Awake (HTTP $code) on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt got HTTP $code."
            [ "$attempt" -lt 3 ] && sleep 20
          done

          # Do not fail the workflow. The API being down is worth knowing, but a
          # red cross every ten minutes trains everyone to ignore the whole
          # Actions tab — the same trap as a test suite that is always red.
          echo "::warning::The API did not answer $HEALTH_URL after three attempts."
