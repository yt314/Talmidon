name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push supersedes the run before it — but only on a pull request. On main
# every commit keeps its own run, so the history of what passed stays intact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: talmidon
          POSTGRES_PASSWORD: talmidon_dev_pw
          POSTGRES_DB: talmidon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talmidon -d talmidon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/Talmidon.Tests/Talmidon.Tests.csproj

      - name: Test
        run: dotnet test backend/Talmidon.Tests --no-restore --logger "console;verbosity=normal"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
