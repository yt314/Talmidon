name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push supersedes the run before it — but only on a pull request. On main
# every commit keeps its own run, so the history of what passed stays intact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Node the site is built and tested with. Keep it on the major in the build stage
# of frontend/Dockerfile, so CI tests what production builds with; Dependabot updates
# the Dockerfile only, so a new major there needs this line changed by hand.
env:
  NODE_VERSION: "26"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: talmidon
          POSTGRES_PASSWORD: talmidon_dev_pw
          POSTGRES_DB: talmidon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talmidon -d talmidon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/Talmidon.Tests/Talmidon.Tests.csproj

      - name: Test
        run: dotnet test backend/Talmidon.Tests --no-restore --logger "console;verbosity=normal"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test -- --watch=false

  # The production images, built the way docker-compose.prod.yml builds them.
  # The jobs above build on the runner's own .NET and Node, so a new base image
  # (a Node, .NET or Caddy update from Dependabot) would otherwise first be
  # built on a real deploy. Nothing is pushed anywhere.
  docker-images:
    name: docker-images (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            dockerfile: backend/Talmidon.Api/Dockerfile
          - image: web
            context: frontend
            dockerfile: frontend/Dockerfile
    env:
      TAG: talmidon-${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "$TAG" "$CONTEXT"

      # The build stage's output path and the Caddyfile are the two things a new
      # Node or Caddy image can break without failing the build itself.
      - name: Check the site and the Caddyfile
        if: matrix.image == 'web'
        run: |
          docker run --rm --entrypoint test "$TAG" -f /srv/index.html
          docker run --rm -e DOMAIN=localhost "$TAG" caddy adapt --config /etc/caddy/Caddyfile > /dev/null

  # The whole product in a real browser: the API against Postgres, the production
  # build of the site under the CSP from vercel.json, and a teacher going from
  # sign-up to a recorded payment. Catches what no unit test can — a script the
  # policy blocks, or two halves that no longer agree with each other.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        # A throwaway database only this job can reach, so it takes no password;
        # the tests connect with the dev connection string from appsettings.json.
        env:
          POSTGRES_USER: talmidon
          POSTGRES_DB: talmidon_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talmidon -d talmidon_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Built up front, so the API starts within the test runner's wait for it
      - name: Build the API
        run: dotnet build backend/Talmidon.Api

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
