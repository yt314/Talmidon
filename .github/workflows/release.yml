name: Release

# Pushing a version tag (v0.1.0) publishes a GitHub release for it. The notes are that
# version's section of CHANGELOG.md, so the changelog is written once and the release
# page never drifts from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Take the notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # From the "## [x.y.z]" heading to the next heading or the link list at the end
          awk -v heading="## [$version]" '
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
            index($0, heading) == 1 { found = 1 }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Talmidon $GITHUB_REF_NAME" --notes-file notes.md
