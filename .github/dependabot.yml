# One grouped pull request per ecosystem, once a month.
#
# The first configuration here was weekly with three npm groups, and it produced
# ten open pull requests in a day on a repository with one maintainer. Dependency
# automation that has to be triaged like that gets muted, which is worse than not
# having it. Grouping everything and slowing the cadence keeps it readable.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /backend/Talmidon.Api
      - /backend/Talmidon.Domain
      - /backend/Talmidon.Infrastructure
      - /backend/Talmidon.Tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # No major upgrades from the bot on the front end. Angular pins the TypeScript
    # range it accepts, PrimeNG's majors track Angular's, and the tooling majors
    # (vitest, jsdom) need their own config changes — each one arrives red and has
    # to be closed. Majors here are done deliberately with `ng update`.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
