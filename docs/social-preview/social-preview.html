<!doctype html>
<!--
  The repository's social preview (Settings → General → Social preview), 1280×640.
  Rebuild after a change, from frontend/ (needs `npx playwright install chromium` once):
    npx playwright screenshot --viewport-size=1280,640 --wait-for-timeout=1500 \
      "file://$PWD/../docs/social-preview/social-preview.html" ../docs/social-preview/social-preview.png
  Colors are the DESIGN.md tokens; the screenshot is docs/images/dashboard.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    position: relative;
    overflow: hidden;
    font-family: "Heebo", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(120deg, #115e59 0%, #0f766e 55%, #155e75 100%);
  }
  /* soft amber and teal light, as behind the sign-in card */
  body::before, body::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); }
  body::before { width: 520px; height: 520px; left: -160px; top: -220px; background: rgba(20, 184, 166, 0.45); }
  body::after { width: 420px; height: 420px; left: 360px; bottom: -300px; background: rgba(245, 158, 11, 0.28); }

  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark { width: 96px; height: 96px; flex: none; border-radius: 20px; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(4, 30, 30, 0.25); }
  .mark svg { width: 62px; height: 62px; }
  h1 { font-size: 76px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .hebrew { font-size: 30px; font-weight: 500; line-height: 1; color: rgba(255, 255, 255, 0.85); margin-top: 8px; text-align: left; }
  .tagline { font-size: 34px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; margin-top: 34px; }
  .detail { font-size: 22px; font-weight: 400; line-height: 1.45; margin-top: 16px; color: rgba(255, 255, 255, 0.86); }

  .window {
    position: absolute; z-index: 1; left: 700px; top: 92px; width: 720px; height: 456px;
    border-radius: 18px; overflow: hidden; background: #f5f5f4;
    box-shadow: 0 30px 80px rgba(4, 30, 40, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .bar { height: 34px; background: #e7e5e4; display: flex; align-items: center; gap: 8px; padding-inline: 16px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #d6d3d1; }
  /* the dashboard's right (RTL start) side: the logo, the menu and the first cards */
  .shot { width: 1440px; height: 900px; background: url(../images/dashboard.png) no-repeat; transform-origin: 0 0; transform: scale(0.7); margin-left: -360px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path fill="#0f766e" d="M12 25.5 32 15l20 10.5L32 36 12 25.5Zm8 5.1v9.1c0 1.8 5.4 6.3 12 6.3s12-4.5 12-6.3v-9.1l-12 6.3-12-6.3Zm29-3.3h3v13h-3v-13Z"/></svg>
      </div>
      <div>
        <h1>Talmidon</h1>
        <p class="hebrew" lang="he" dir="rtl">תלמידון</p>
      </div>
    </div>
    <p class="tagline">One place for a private tutor's whole practice.</p>
    <p class="detail">Lessons, billing, notes and messages, plus portals for parents and students. In Hebrew, built for Israel.</p>
  </div>
  <div class="window"><div class="bar"><i></i><i></i><i></i></div><div class="shot"></div></div>
</body>
</html>
